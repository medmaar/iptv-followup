name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: iptv-followup
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          # Strip stray spaces/newlines pasted into the secrets
          echo "::add-mask::$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"
          echo "CF_ACCOUNT_ID=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CF_API_TOKEN=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "Account ID length: $(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]' | wc -c) (should be 32)"
          [ -n "$CF_API_TOKEN" ] || { echo "::error::Repo secret CF_API_TOKEN is missing"; exit 1; }
          [ -n "$CF_ACCOUNT_ID" ] || { echo "::error::Repo secret CF_ACCOUNT_ID is missing"; exit 1; }

      - name: Create the Pages project if it does not exist
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          code=$(curl -sS -o get.json -w '%{http_code}' "$API/$PROJECT" -H "Authorization: Bearer $CF_API_TOKEN")
          if [ "$code" = "404" ]; then
            curl -s -X POST "$API" -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" > get.json
          fi
          python3 - <<'PY'
          import json, sys
          d = json.load(open('get.json'))
          if not d.get('success'):
              sys.exit('Cloudflare API error: %s' % d.get('errors'))
          print('Pages project:', d['result']['name'], '->', 'https://' + d['result']['subdomain'])
          PY
          rm get.json

      - name: Copy site files
        run: mkdir site && cp index.html site/

      - name: Deploy
        run: >
          CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          npx --yes wrangler@3 pages deploy site
          --project-name "$PROJECT"
          --branch main
          --commit-dirty=true
